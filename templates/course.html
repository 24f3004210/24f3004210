{% extends "base.html" %}
{% block content %} 

<form action="/course" method="POST">
    <h2 class="center">Course</h2>
    <input type="hidden" name="id" value="{{ course.course_id }}">
    <table class="center">
        <tr><td><label>Course code: </label></td><td><input type="text" name="course_code" value="{{ course.course_code }}" required></td></tr>
        <tr><td><label>Name: </label></td><td><input type="text" name="name" value="{{ course.course_name }}" required></td></tr>
        <tr><td><label>Status: </label></td><td><select name="status" required>
            <option value="Active" {% if course.status == "Active" %}selected{% endif %}>Active</option>
            <option value="Inactive" {% if course.status == "Inactive" %}selected{% endif %}>Inactive</option>
        </select></td></tr>
        <tr><td><input type="submit" value="Update"></td><td><a href="{{ url_for('admin_dashboard') }}" class="btn-link btn-danger">Cancel</a></td></tr>
        <tr><td colspan="2" class="err">{{ err_msg }}</td></tr>
    </table>
    <p class="center"><a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a></p>
</form>

{% endblock %}
