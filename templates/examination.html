{% extends "base.html" %}
{% block content %} 

<form action="/exam" method="POST">
    <h2 class="center">Examination</h2>
    <input type="hidden" name="id" value="{{ exam.exam_id }}">
    <table class="center">
        <tr><td><label>Course code: </label></td><td><input type="text" name="course_code" value="{% if exam %}{{ exam.course.course_code }}{% endif %}" required></td></tr>
        <tr><td><label>Name: </label></td><td><input type="text" name="name" value="{{ exam.name }}" required></td></tr>
        <tr><td><label>Type: </label></td><td><select name="exam_type" required>
            <option value="Viva" {% if exam.exam_type == "Viva" %}selected{% endif %}>Viva</option>
            <option value="Practical" {% if exam.exam_type == "Practical" %}selected{% endif %}>Practical</option>
            <option value="Project Demo" {% if exam.exam_type == "Project Demo" %}selected{% endif %}>Project Demo</option>
            <option value="Mid Semester" {% if exam.exam_type == "Mid Semester" %}selected{% endif %}>Mid Semester</option>
            <option value="End Semester" {% if exam.exam_type == "End Semester" %}selected{% endif %}>End Semester</option>
        </select></td></tr>
        <tr><td><label>Duration (minutes): </label></td><td><input type="number" name="duration" value="{{ exam.duration }}" min="1" required></td></tr>
        <tr><td><label>Max marks: </label></td><td><input type="number" name="max_marks" value="{{ exam.max_marks }}" min="1" required></td></tr>
        <tr><td><input type="submit" value="Update"></td><td><a href="{{ url_for('admin_dashboard') }}" class="btn-link btn-danger">Cancel</a></td></tr>
        <tr><td colspan="2" class="err">{{ err_msg }}</td></tr>
    </table>
    <p class="center"><a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a></p>
</form>

{% endblock %}
